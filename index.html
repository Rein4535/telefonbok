<style>
  :root{
    --ink:#14213D;
    --ink-soft:#3D4C6B;
    --paper:#F1F4F3;
    --surface:#FFFFFF;
    --line:#DCE2E0;
    --accent:#C1432A;
    --accent-soft:#F3DCD5;
    --chip-bg:#14213D;
    --chip-text:#EAF1EE;
    --focus:#0F6E6E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(193,67,42,0.35), transparent 70%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#9FB0C9;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{
    margin:6px 0 0;
    font-size:14px;
    color:#B9C4D6;
    max-width:46ch;
  }

  /* ---------- Search bar ---------- */
  .search-wrap{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    padding:14px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{
    border-color:var(--focus);
    box-shadow:0 0 0 3px rgba(15,110,110,0.15);
  }
  .search-box svg{flex:none; opacity:.55;}
  #q{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
  }
  #q::placeholder{color:#8B97A8;}
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  #clearBtn{
    border:none;
    background:none;
    color:var(--accent);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    padding:4px 6px;
    display:none;
  }

  /* ---------- List ---------- */
  main{padding:6px 20px 60px; max-width:880px; margin:0 auto;}
  .row{
    display:flex;
    flex-direction:column;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .info{min-width:0; flex:1;}
  .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.25;
    margin:0 0 4px;
    word-break:break-word;
  }
  .name mark{
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:3px;
    padding:0 1px;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .tag{
    background:#E7ECEA;
    border-radius:999px;
    padding:2px 9px;
  }
  .note{
    font-size:12px;
    color:var(--accent);
    font-style:italic;
    margin-top:4px;
  }
  .numbers{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:none;
  }
  .chip{
    display:flex;
    align-items:baseline;
    gap:7px;
    background:var(--chip-bg);
    color:var(--chip-text);
    border-radius:8px;
    padding:6px 10px;
    text-decoration:none;
    min-width:132px;
    transition:transform .1s ease, background .15s ease;
  }
  .chip:hover, .chip:focus-visible{
    background:var(--focus);
    transform:translateX(-2px);
    outline:none;
  }
  .chip .lbl{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.65;
    width:16px;
    flex:none;
  }
  .chip .num{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }

  /* ---------- Row actions (edit/delete) ---------- */
  .row-main{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    width:100%;
  }
  .actions{
    display:flex;
    gap:4px;
    flex:none;
  }
  .action-btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    border-radius:7px;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:13px;
    flex:none;
  }
  .action-btn:hover{background:#E7ECEA;}
  .action-btn.danger:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft);}
  .edited-tag{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--focus);
    background:#DCEEEE;
    border-radius:4px;
    padding:1px 5px;
    margin-left:6px;
    vertical-align:middle;
  }

  .edit-panel{
    margin-top:10px;
    padding:12px;
    background:#F6F8F7;
    border:1px solid var(--line);
    border-radius:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .edit-panel label{
    display:flex;
    flex-direction:column;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    gap:3px;
  }
  .edit-panel input{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--surface);
    color:var(--ink);
  }
  .edit-panel .full{grid-column:1 / -1;}
  .edit-panel .row-btns{
    grid-column:1 / -1;
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .edit-panel button{
    border:none;
    border-radius:7px;
    padding:8px 14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .btn-save{background:var(--ink); color:var(--paper);}
  .btn-cancel{background:transparent; color:var(--ink-soft); border:1px solid var(--line) !important;}

  .changes-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#DCEEEE;
    color:var(--ink);
    font-size:12px;
    padding:8px 14px;
    border-radius:9px;
    margin:0 0 10px;
  }
  .changes-banner button{
    border:none;
    background:none;
    color:var(--focus);
    font-weight:700;
    cursor:pointer;
    font-size:12px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:6px;}

  @media (max-width:520px){
    .row{flex-direction:column;}
    .numbers{flex-direction:row; flex-wrap:wrap;}
    .chip{min-width:auto;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>

<script>
const BASE_DATA = JSON.parse(document.getElementById('data').textContent);

// Sort alphabetically, Faroese/Danish-aware where the browser supports it
try {
  BASE_DATA.sort((a,b)=>a.navn.localeCompare(b.navn,'fo'));
} catch(e) {
  BASE_DATA.sort((a,b)=>a.navn.localeCompare(b.navn));
}

const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const countEl = document.getElementById('countLabel');
const clearBtn = document.getElementById('clearBtn');
const banner = document.getElementById('changesBanner');
const changesText = document.getElementById('changesText');
const resetChangesBtn = document.getElementById('resetChangesBtn');

const LS_EDITS = 'telefonbok_edits';   // { [id]: {navn,starv,deild,sted,lokal,fart,bein,merknad} }
const LS_DELETED = 'telefonbok_deleted'; // [id, id, ...]

function loadEdits(){
  try { return JSON.parse(localStorage.getItem(LS_EDITS)) || {}; } catch(e){ return {}; }
}
function loadDeleted(){
  try { return new Set(JSON.parse(localStorage.getItem(LS_DELETED)) || []); } catch(e){ return new Set(); }
}
function saveEdits(edits){ localStorage.setItem(LS_EDITS, JSON.stringify(edits)); }
function saveDeleted(set){ localStorage.setItem(LS_DELETED, JSON.stringify([...set])); }

let editingId = null; // which row currently shows its edit form

function getData(){
  const edits = loadEdits();
  const deleted = loadDeleted();
  return BASE_DATA
    .filter(e => !deleted.has(e.id))
    .map(e => edits[e.id] ? Object.assign({}, e, edits[e.id], {id:e.id, _edited:true}) : e);
}

function updateBanner(){
  const edits = loadEdits();
  const deleted = loadDeleted();
  const n = Object.keys(edits).length + deleted.size;
  if(n === 0){ banner.style.display = 'none'; return; }
  banner.style.display = 'flex';
  changesText.textContent = `Tú hevur ${n} broyting${n===1?'':'ar'} goymdar á hesum tóli (bert sjónligt her).`;
}

resetChangesBtn.addEventListener('click', () => {
  if(!confirm('Strika allar tínar goymdu broytingar/strikingar á hesum tóli?')) return;
  localStorage.removeItem(LS_EDITS);
  localStorage.removeItem(LS_DELETED);
  editingId = null;
  updateBanner();
  render();
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, term){
  text = String(text || '');
  if(!term) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+term.length)) + '</mark>' + escapeHtml(text.slice(idx+term.length));
}

function chip(label, value, term){
  if(!value) return '';
  const tel = String(value).replace(/[^\d+]/g,'');
  return `<a class="chip" href="tel:${tel}">
      <span class="lbl">${label}</span>
      <span class="num">${highlight(value, term)}</span>
    </a>`;
}

function matches(entry, term){
  if(!term) return true;
  const hay = [entry.navn, entry.starv, entry.deild, entry.sted, entry.lokal, entry.fart, entry.bein, entry.merknad]
    .join(' ').toLowerCase();
  return hay.includes(term.toLowerCase());
}

function editPanelHtml(e){
  const f = (name, label, val) => `
    <label>${label}
      <input type="text" data-field="${name}" value="${escapeHtml(val || '')}">
    </label>`;
  return `<div class="edit-panel" data-id="${e.id}">
      ${f('navn','Navn', e.navn)}
      ${f('starv','Starvsheiti', e.starv)}
      ${f('deild','Deild', e.deild)}
      ${f('sted','Staðseting', e.sted)}
      ${f('lokal','Lokal nummar', e.lokal)}
      ${f('fart','Fartelefon', e.fart)}
      ${f('bein','Beinleiðis', e.bein)}
      <label class="full">Merknad
        <input type="text" data-field="merknad" value="${escapeHtml(e.merknad || '')}">
      </label>
      <div class="row-btns">
        <button class="btn-save" data-action="save" data-id="${e.id}">Goym</button>
        <button class="btn-cancel" data-action="cancel" data-id="${e.id}">Ógilda</button>
      </div>
    </div>`;
}

function render(){
  const term = qEl.value.trim();
  clearBtn.style.display = term ? 'inline-block' : 'none';
  updateBanner();

  const data = getData();
  const results = data.filter(e => matches(e, term));
  countEl.textContent = term
    ? `${results.length} av ${data.length} funnin`
    : `${data.length} uppfoeringar`;

  if(results.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">Einki funnið</div>Royn eitt styttra orð ella eitt annað leitiorð.</div>`;
    return;
  }

  const html = results.slice(0, 400).map(e => {
    const tags = [e.starv, e.deild, e.sted].filter(Boolean)
      .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    const note = e.merknad ? `<div class="note">${escapeHtml(e.merknad)}</div>` : '';
    const chips = chip('L', e.lokal, term) + chip('F', e.fart, term) + chip('B', e.bein, term);
    const editedTag = e._edited ? '<span class="edited-tag">broytt</span>' : '';
    const panel = (editingId === e.id) ? editPanelHtml(e) : '';
    return `<div class="row" data-row-id="${e.id}">
        <div class="row-main">
          <div class="info">
            <p class="name">${highlight(e.navn, term)}${editedTag}</p>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
            ${note}
          </div>
          <div class="actions">
            ${chips ? `<div class="numbers">${chips}</div>` : ''}
            <button class="action-btn" data-action="edit" data-id="${e.id}" title="Rediger" aria-label="Rediger">✎</button>
            <button class="action-btn danger" data-action="delete" data-id="${e.id}" title="Strika" aria-label="Strika">🗑</button>
          </div>
        </div>
        ${panel}
      </div>`;
  }).join('');
  listEl.innerHTML = html;

  if(results.length > 400){
    listEl.innerHTML += `<div class="empty">Vís bert teir 400 fyrstu — mjóðka leitingina fyri fleiri úrslit.</div>`;
  }
}

listEl.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = Number(btn.dataset.id);

  if(action === 'edit'){
    editingId = (editingId === id) ? null : id;
    render();
  } else if(action === 'cancel'){
    editingId = null;
    render();
  } else if(action === 'delete'){
    const entry = getData().find(e => e.id === id);
    if(!confirm(`Strika "${entry ? entry.navn : ''}" á hesum tóli? (Bert sjónligt her, ikki fyri onnur.)`)) return;
    const deleted = loadDeleted();
    deleted.add(id);
    saveDeleted(deleted);
    editingId = null;
    render();
  } else if(action === 'save'){
    const panel = btn.closest('.edit-panel');
    const edits = loadEdits();
    const updated = {};
    panel.querySelectorAll('[data-field]').forEach(inp => {
      updated[inp.dataset.field] = inp.value.trim();
    });
    edits[id] = updated;
    saveEdits(edits);
    editingId = null;
    render();
  }
});

qEl.addEventListener('input', render);
clearBtn.addEventListener('click', () => { qEl.value=''; render(); qEl.focus(); });

render();


// ---------- PWA: service worker + install prompt ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

</script>
</body>
</html>
